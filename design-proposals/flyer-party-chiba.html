<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>出版記念パーティ Vol.1 — フライヤー（千葉）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --mint: #d8efd4;
      --mint-deep: #7fbf78;
      --mint-band: #8fd189;
      --ink: #2a4030;
      --pink: #e85a9b;
      --pink-soft: #f078ad;
      --orange: #f08a3a;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #cfe3cb;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .page-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
    }

    .flyer {
      width: min(1123px, 100%);
      aspect-ratio: 297 / 210;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #eaf8e7 0%, var(--mint) 40%, #dff3db 100%);
      box-shadow: 0 18px 48px rgba(60, 110, 70, 0.28);
    }

    .flyer__band {
      position: absolute;
      left: 0;
      right: 0;
      height: 11%;
      background: var(--mint-band);
      overflow: hidden;
    }

    .flyer__band--top { top: 0; }
    .flyer__band--bottom { bottom: 0; }

    .flyer__band img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0.95;
      mix-blend-mode: multiply;
    }

    .flyer__clover {
      position: absolute;
      width: 22%;
      height: auto;
      z-index: 2;
      pointer-events: none;
    }

    .flyer__clover--tr {
      top: 10%;
      right: 1.5%;
      width: 24%;
    }

    .flyer__clover--bl {
      bottom: 10%;
      left: 1%;
      width: 20%;
      transform: scaleX(-1);
    }

    .flyer__inner {
      position: relative;
      z-index: 4;
      height: 100%;
      display: grid;
      grid-template-columns: 0.95fr 1.15fr 0.95fr;
      gap: 0.75rem;
      padding: 12% 3.5% 12%;
      align-items: center;
    }

    .flyer__caricature-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flyer__caricature {
      width: min(100%, 240px);
      height: auto;
      border-radius: 1rem;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 8px 24px rgba(70, 120, 80, 0.18);
    }

    .flyer__copy {
      text-align: center;
      padding: 0 0.4rem;
    }

    .flyer__host {
      margin: 0 0 0.55rem;
      font-size: clamp(0.85rem, 1.5vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
    }

    .flyer__title {
      margin: 0 0 0.35rem;
      font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
      font-size: clamp(1.7rem, 3.6vw, 2.65rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.25;
      color: var(--pink);
      text-shadow: 0 1px 0 rgba(255,255,255,0.55);
    }

    .flyer__book-title {
      margin: 0 0 0.85rem;
      font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--pink-soft);
    }

    .flyer__lead {
      margin: 0 auto 1.15rem;
      max-width: 28em;
      font-size: clamp(0.72rem, 1.2vw, 0.88rem);
      line-height: 1.75;
      font-weight: 500;
      color: var(--ink);
    }

    .flyer__meta {
      display: grid;
      gap: 0.55rem;
      justify-items: center;
      margin: 0;
    }

    .flyer__meta-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 0.55rem 0.7rem;
      max-width: 100%;
    }

    .flyer__label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-width: 4.2rem;
      padding: 0.28rem 0.85rem;
      border-radius: 999px;
      background: var(--orange);
      color: var(--white);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      line-height: 1.2;
    }

    .flyer__meta-row dd {
      margin: 0;
      flex: 1 1 auto;
      font-size: clamp(0.82rem, 1.35vw, 0.98rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--ink);
      white-space: nowrap;
    }

    .flyer__date {
      position: absolute;
      top: 12.5%;
      right: 3.5%;
      z-index: 5;
      margin: 0;
      font-family: "M PLUS Rounded 1c", sans-serif;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      font-weight: 800;
      color: var(--ink);
      letter-spacing: 0.04em;
    }

    .flyer__book-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0.4rem 1.5rem 4.5rem 0;
      position: relative;
      z-index: 4;
    }

    .flyer__book {
      width: min(100%, 200px);
      height: auto;
      filter: drop-shadow(0 12px 20px rgba(40, 70, 50, 0.25));
      transform: rotate(2deg);
    }

    .flyer__roses {
      position: absolute;
      right: 2.2%;
      left: auto;
      bottom: 12.5%;
      width: 9.5%;
      height: auto;
      z-index: 6;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    }

    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background: white; }
      .page-wrap { padding: 0; min-height: auto; }
      .flyer {
        width: 297mm;
        height: 210mm;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }

    @media (max-width: 860px) {
      .flyer {
        aspect-ratio: auto;
        min-height: 980px;
      }
      .flyer__inner {
        grid-template-columns: 1fr;
        padding: 14% 6% 14%;
        gap: 1.25rem;
      }
      .flyer__book { transform: none; width: min(55%, 200px); }
      .flyer__roses { right: 4%; left: auto; bottom: 10%; width: 14%; }
      .flyer__meta-row { flex-wrap: wrap; }
      .flyer__meta-row dd { white-space: normal; }
      .flyer__date { right: 6%; top: 12%; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <article class="flyer" aria-label="出版記念パーティ Vol.1 フライヤー">
      <div class="flyer__band flyer__band--top" aria-hidden="true">
        <img src="images/flyer-banner.png" alt="" />
      </div>
      <div class="flyer__band flyer__band--bottom" aria-hidden="true">
        <img src="images/flyer-banner.png" alt="" />
      </div>

      <img class="flyer__clover flyer__clover--tr" src="images/flyer-clover-clear.png" alt="" />
      <img class="flyer__clover flyer__clover--bl" src="images/flyer-clover2-clear.png" alt="" />
      <img class="flyer__roses" src="images/flyer-roses.gif" alt="" />

      <p class="flyer__date">2026年8月29日</p>

      <div class="flyer__inner">
        <div class="flyer__caricature-wrap">
          <img
            class="flyer__caricature"
            src="images/nakashima-caricature.png"
            alt="中嶌剛先生の似顔絵"
            width="320"
            height="268"
          />
        </div>

        <div class="flyer__copy">
          <p class="flyer__host">【とりあえず研究所主催】</p>
          <h1 class="flyer__title">出版記念パーティ Vol.1</h1>
          <p class="flyer__book-title">「とりあえず」でキャリアは決まる</p>
          <p class="flyer__lead">
            2026年6月に刊行した新刊本（ちくまプリマー新書）の出版を記念して関係者の皆さんと執筆過程の苦労・エピソードを語り尽くす！
          </p>
          <dl class="flyer__meta">
            <div class="flyer__meta-row">
              <dt class="flyer__label">とき</dt>
              <dd>2026年8月29日（土）開場14:30～／15時開始〜17時終了</dd>
            </div>
            <div class="flyer__meta-row">
              <dt class="flyer__label">ところ</dt>
              <dd>千葉経済大学1号館5F、505演習室</dd>
            </div>
            <div class="flyer__meta-row">
              <dt class="flyer__label">参加費</dt>
              <dd>第1部（セレモニー）1,000円／第2部（懇親会）4,000円</dd>
            </div>
          </dl>
        </div>

        <div class="flyer__book-wrap">
          <img
            class="flyer__book"
            src="images/toriaezu-career-book.png"
            alt="『「とりあえず」でキャリアは決まる』書影"
            width="440"
            height="700"
          />
        </div>
      </div>
    </article>
  </div>
</body>
</html>
